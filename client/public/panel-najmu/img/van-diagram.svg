<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <style>
    .body { fill: #f2f2f2; stroke: #888; stroke-width: 3; }
    .detail { fill: none; stroke: #999; stroke-width: 2; }
    .dark { fill: #6b6b6b; }
    .wheel { fill: #5a5a5a; stroke: #333; stroke-width: 2; }
    .hub { fill: #cfcfcf; }
    .label { fill: #888; font-size: 15px; }
  </style>

  <!-- FRONT VIEW -->
  <g transform="translate(30,20)">
    <text class="label" x="150" y="16" text-anchor="middle">PRZÓD</text>
    <rect class="body" x="60" y="30" width="300" height="200" rx="26" />
    <path class="detail" d="M 95 55 L 325 55 L 300 110 L 120 110 Z" />
    <rect class="dark" x="110" y="150" width="140" height="55" rx="8" />
    <path class="detail" d="M120 150 L120 205 M140 150 L140 205 M160 150 L160 205 M180 150 L180 205 M200 150 L200 205 M220 150 L220 205 M240 150 L240 205" />
    <rect class="detail" x="65" y="150" width="30" height="20" rx="4" />
    <rect class="detail" x="285" y="150" width="30" height="20" rx="4" />
    <rect class="dark" x="60" y="215" width="300" height="18" rx="6" />
    <circle class="wheel" cx="95" cy="235" r="26" /><circle class="hub" cx="95" cy="235" r="11" />
    <circle class="wheel" cx="325" cy="235" r="26" /><circle class="hub" cx="325" cy="235" r="11" />
  </g>

  <!-- SIDE VIEW (right-facing) -->
  <g transform="translate(420,20)">
    <text class="label" x="220" y="16" text-anchor="middle">BOK (strona kierowcy)</text>
    <path class="body" d="M20 150 Q20 90 80 85 L140 85 Q170 40 230 40 L360 40 Q420 40 420 100 L420 170 Q420 195 395 195 L45 195 Q20 195 20 170 Z" />
    <path class="detail" d="M150 88 Q175 50 230 48 L235 110 L150 110 Z" />
    <path class="detail" d="M250 48 L355 48 Q405 48 410 100 L410 110 L250 110 Z" />
    <line class="detail" x1="235" y1="48" x2="235" y2="195" />
    <line class="detail" x1="235" y1="115" x2="410" y2="115" />
    <rect class="dark" x="30" y="165" width="380" height="14" rx="4" />
    <circle class="wheel" cx="100" cy="200" r="32" /><circle class="hub" cx="100" cy="200" r="14" />
    <circle class="wheel" cx="345" cy="200" r="32" /><circle class="hub" cx="345" cy="200" r="14" />
  </g>

  <!-- REAR VIEW -->
  <g transform="translate(30,320)">
    <text class="label" x="150" y="16" text-anchor="middle">TYŁ</text>
    <rect class="body" x="60" y="30" width="300" height="200" rx="26" />
    <rect class="detail" x="110" y="55" width="140" height="55" rx="6" />
    <line class="detail" x1="180" y1="55" x2="180" y2="110" />
    <line class="detail" x1="180" y1="120" x2="180" y2="215" />
    <rect class="dark" x="150" y="150" width="60" height="30" rx="4" />
    <rect class="dark" x="60" y="215" width="300" height="18" rx="6" />
    <circle class="wheel" cx="95" cy="235" r="26" /><circle class="hub" cx="95" cy="235" r="11" />
    <circle class="wheel" cx="325" cy="235" r="26" /><circle class="hub" cx="325" cy="235" r="11" />
  </g>

  <!-- SIDE VIEW (left-facing, mirrored) -->
  <g transform="translate(880,320) scale(-1,1)">
    <text class="label" x="220" y="16" text-anchor="middle" transform="scale(-1,1) translate(-440,0)">BOK (strona pasażera)</text>
    <path class="body" d="M20 150 Q20 90 80 85 L140 85 Q170 40 230 40 L360 40 Q420 40 420 100 L420 170 Q420 195 395 195 L45 195 Q20 195 20 170 Z" />
    <path class="detail" d="M150 88 Q175 50 230 48 L235 110 L150 110 Z" />
    <path class="detail" d="M250 48 L355 48 Q405 48 410 100 L410 110 L250 110 Z" />
    <line class="detail" x1="235" y1="48" x2="235" y2="195" />
    <line class="detail" x1="235" y1="115" x2="410" y2="115" />
    <rect class="dark" x="30" y="165" width="380" height="14" rx="4" />
    <circle class="wheel" cx="100" cy="200" r="32" /><circle class="hub" cx="100" cy="200" r="14" />
    <circle class="wheel" cx="345" cy="200" r="32" /><circle class="hub" cx="345" cy="200" r="14" />
  </g>
</svg>
