<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Wypożyczalnia — Protokoły</title>
<link rel="manifest" href="/panel-najmu/manifest.json" />
<meta name="theme-color" content="#14304d" />
<link rel="icon" href="/panel-najmu/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/panel-najmu/icons/icon-192.png" />
<link rel="stylesheet" href="/panel-najmu/css/style.css" />
</head>
<body>

<header class="topbar">
  <button id="backBtn" class="icon-btn" hidden aria-label="Wstecz">←</button>
  <h1 id="pageTitle">Wynajmy</h1>
</header>

<main id="app"></main>

<!-- ===== TEMPLATES (cloned into #app by app.js) ===== -->

<template id="tpl-list">
  <section class="view">
    <button class="btn btn-primary btn-block" data-action="new-handover">+ Nowe wydanie pojazdu</button>
    <button class="btn btn-secondary btn-block" data-action="new-protocol-link">+ Nowy protokół (link dla najemcy)</button>
    <button class="btn btn-secondary btn-block" data-action="view-drafts">Szkice protokołów</button>
    <button class="btn btn-secondary btn-block" data-action="view-history">Zakończone wynajmy</button>
    <button class="btn btn-secondary btn-block" data-action="view-vehicles">Baza pojazdów</button>
    <button class="btn btn-secondary btn-block" data-action="view-tenants">Baza najemców</button>
    <button class="btn btn-secondary btn-block" data-action="new-contract">Wygeneruj umowę</button>
    <button class="btn btn-secondary btn-block" data-action="view-posts">Blog</button>
    <div id="rentalList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-new-protocol">
  <section class="view">
    <p class="muted">Załóż wstępny protokół i wygeneruj link, który najemca otworzy samodzielnie — bez logowania do panelu, tylko hasłem ustawionym tutaj. Tym samym hasłem, pod tym samym linkiem, najemca później zrobi też zwrot pojazdu.</p>
    <form id="newProtocolForm" class="form">
      <fieldset>
        <legend>Pojazd</legend>
        <label>Nr rejestracyjny
          <input name="vehiclePlate" required />
        </label>
        <label>Model pojazdu
          <input name="vehicleModel" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Najemca (opcjonalnie — najemca i tak wypełni/poprawi te dane sam)</legend>
        <label>Imię i nazwisko
          <input name="tenantName" />
        </label>
        <label>Telefon
          <input name="tenantPhone" type="tel" />
        </label>
        <label>E-mail
          <input name="tenantEmail" type="email" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Hasło do tego protokołu</legend>
        <label>Hasło (min. 6 znaków) — przekaż je najemcy razem z linkiem
          <input name="password" type="text" required minlength="6" />
        </label>
      </fieldset>

      <p id="newProtocolError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="newProtocolSubmitBtn">
        Utwórz protokół i link
      </button>
    </form>
    <div id="newProtocolResult" hidden>
      <p class="muted">Protokół utworzony. Przekaż najemcy poniższy link i hasło (np. SMS-em):</p>
      <p><strong>Link:</strong> <span id="newProtocolLink"></span></p>
      <button type="button" class="btn btn-secondary btn-block" id="copyLinkBtn">Kopiuj link</button>
      <button type="button" class="btn btn-text" id="newProtocolBackBtn">Wróć do listy</button>
    </div>
  </section>
</template>

<template id="tpl-drafts">
  <section class="view">
    <div id="draftsList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-history">
  <section class="view">
    <input type="search" id="historyFilter" placeholder="Szukaj po nr rejestracyjnym…" />
    <div id="historyList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-vehicles">
  <section class="view">
    <button class="btn btn-primary btn-block" data-action="new-vehicle">+ Dodaj pojazd</button>
    <div id="vehicleList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-vehicle-form">
  <section class="view">
    <form id="vehicleForm" class="form">
      <fieldset>
        <legend>Pojazd</legend>
        <label>Nr rejestracyjny
          <input name="plate" required />
        </label>
        <label>Marka
          <input name="make" />
        </label>
        <label>Model
          <input name="model" />
        </label>
        <label>VIN
          <input name="vin" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Serwis i przebieg</legend>
        <div class="row">
          <label>Ostatni serwis olejowy
            <input name="lastOilServiceDate" type="date" />
          </label>
          <label>Przebieg przy serwisie (km)
            <input name="lastOilServiceMileage" inputmode="numeric" />
          </label>
        </div>
        <div class="row">
          <label>Ostatni serwis chłodni
            <input name="lastCoolingServiceDate" type="date" />
          </label>
          <label>Przebieg przy serwisie (km)
            <input name="lastCoolingServiceMileage" inputmode="numeric" />
          </label>
        </div>
        <div class="row">
          <label>Ostatnie uzupełnienie AdBlue
            <input name="lastAdBlueDate" type="date" />
          </label>
          <label>Przebieg przy uzupełnieniu (km)
            <input name="lastAdBlueMileage" inputmode="numeric" />
          </label>
        </div>
        <label>Ostatni zarejestrowany przebieg (km)
          <input name="lastMileage" inputmode="numeric" />
        </label>
      </fieldset>

      <p id="vehicleFormError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="vehicleSubmitBtn">
        Zapisz pojazd
      </button>
    </form>

    <div id="vehicleExtrasWrap" class="form" hidden>
      <fieldset>
        <legend>Dokumentacja zdjęciowa uszkodzeń</legend>
        <p class="muted">Zdjęcia stałe pojazdu — niezależne od protokołów, dołączane automatycznie do każdego kolejnego protokołu wydania/zwrotu.</p>
        <div id="vehiclePhotoStrip" class="photo-strip"></div>
        <label class="btn btn-secondary btn-block file-btn">
          + Dodaj zdjęcie uszkodzenia
          <input type="file" accept="image/*" capture="environment" id="vehiclePhotoInput" hidden />
        </label>
      </fieldset>

      <fieldset>
        <legend>Schemat uszkodzeń</legend>
        <p class="muted">Ten sam schemat, co przy wydaniu/zwrocie — edycja tutaj aktualizuje podpowiedź dla kolejnego protokołu bez konieczności jego tworzenia.</p>
        <div class="damage-map-wrap">
          <canvas id="vehicleDamageMap" class="damage-map" width="600" height="400"></canvas>
          <div class="damage-map-overlay" id="vehicleDamageMapOverlay">Dotknij, aby zaznaczyć uszkodzenie</div>
        </div>
        <div class="damage-map-pending-actions" id="vehicleDamageMapPendingActions" hidden>
          <button type="button" class="btn btn-secondary" id="vehicleDamageMapDiscardBtn">Odrzuć</button>
          <button type="button" class="btn btn-primary" id="vehicleDamageMapConfirmBtn">Zatwierdź zaznaczenie</button>
        </div>
        <button type="button" class="btn btn-text" id="vehicleDamageMapClearBtn">Wyczyść wszystkie zaznaczenia</button>
        <button type="button" class="btn btn-secondary btn-block" id="vehicleDamageMapSaveBtn">Zapisz schemat</button>
      </fieldset>
    </div>
  </section>
</template>

<template id="tpl-tenants">
  <section class="view">
    <button class="btn btn-primary btn-block" data-action="new-tenant">+ Dodaj najemcę</button>
    <div id="tenantList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-tenant-form">
  <section class="view">
    <form id="tenantForm" class="form">
      <fieldset>
        <legend>Najemca</legend>
        <label>Typ najemcy
          <select name="tenantType" id="tenantFormTypeSelect">
            <option value="osoba">Osoba prywatna</option>
            <option value="firma">Firma</option>
          </select>
        </label>
        <label id="tenantFormPeselWrap">PESEL
          <input name="pesel" />
        </label>
        <label id="tenantFormIdNumberWrap">Seria i numer dowodu
          <input name="idNumber" />
        </label>
        <label id="tenantFormNipWrap" hidden>NIP
          <input name="nip" />
        </label>
        <label id="tenantFormKrsWrap" hidden>KRS
          <input name="krs" />
        </label>
        <label id="tenantFormRepresentativeWrap" hidden>Osoba uprawniona do reprezentowania
          <input name="representative" />
        </label>
        <label id="tenantFormNameLabel">Imię i nazwisko
          <input name="name" required />
        </label>
        <label>Telefon
          <input name="phone" type="tel" />
        </label>
        <label>E-mail
          <input name="email" type="email" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Adres</legend>
        <div class="row">
          <label>Ulica
            <input name="street" />
          </label>
          <label>Nr domu
            <input name="houseNumber" />
          </label>
        </div>
        <div class="row">
          <label>Nr mieszkania
            <input name="apartmentNumber" />
          </label>
          <label>Kod pocztowy
            <input name="postalCode" />
          </label>
        </div>
        <label>Miejscowość
          <input name="city" />
        </label>
      </fieldset>

      <p id="tenantFormError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="tenantSubmitBtn">
        Zapisz najemcę
      </button>
    </form>
  </section>
</template>

<template id="tpl-posts">
  <section class="view">
    <button class="btn btn-primary btn-block" data-action="new-post">+ Nowy wpis</button>
    <div id="postList" class="rental-list">
      <p class="muted">Wczytywanie…</p>
    </div>
  </section>
</template>

<template id="tpl-post-form">
  <section class="view">
    <form id="postForm" class="form">
      <fieldset>
        <legend>Treść wpisu</legend>
        <label class="btn btn-secondary btn-block file-btn">
          Wczytaj plik .md
          <input type="file" accept=".md,.markdown,text/markdown,text/plain" id="postFileInput" hidden />
        </label>
        <label>Wklejona treść (Markdown — # Tytuł, potem &gt; opis, potem treść)
          <textarea name="raw" id="postRawTextarea" rows="12" placeholder="# Tytuł wpisu&#10;&#10;&gt; Krótki opis (meta description)&#10;&#10;Treść wpisu..."></textarea>
        </label>
        <button type="button" class="btn btn-text" id="postParseBtn">Wczytaj tytuł i opis z treści</button>
      </fieldset>

      <fieldset>
        <legend>Obrazek wyróżniający</legend>
        <div id="postImagePreviewWrap" hidden>
          <img id="postImagePreview" class="post-image-preview" alt="Podgląd obrazka" />
          <button type="button" class="btn btn-text" id="postImageRemoveBtn">Usuń obrazek</button>
        </div>
        <label class="btn btn-secondary btn-block file-btn">
          Wybierz obrazek
          <input type="file" accept="image/*" id="postImageInput" hidden />
        </label>
      </fieldset>

      <fieldset>
        <legend>Metadane</legend>
        <label>Tytuł (H1)
          <input name="title" id="postTitleInput" required />
        </label>
        <label>Adres URL wpisu (slug)
          <input name="slug" id="postSlugInput" required />
        </label>
        <label>Opis (meta description, ok. 150-160 znaków)
          <textarea name="description" id="postDescriptionInput" rows="2" required></textarea>
        </label>
        <label>Status
          <select name="status" id="postStatusSelect">
            <option value="draft">Szkic (niewidoczny publicznie)</option>
            <option value="published">Opublikowany</option>
          </select>
        </label>
        <label id="postPublishAtWrap" hidden>Data i godzina publikacji
          <input type="datetime-local" name="publishAt" id="postPublishAtInput" />
        </label>
        <p id="postPublishAtHint" class="muted" hidden>
          Ustaw datę w przyszłości, aby zaplanować publikację — wpis pojawi się na stronie automatycznie o tej porze.
        </p>
      </fieldset>

      <p id="postFormError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="postSubmitBtn">
        Zapisz wpis
      </button>
      <button type="button" class="btn btn-text" id="postDeleteBtn" hidden>Usuń wpis</button>
    </form>
  </section>
</template>

<template id="tpl-contract">
  <section class="view">
    <form id="contractForm" class="form">
      <fieldset>
        <legend>Najemca</legend>
        <label class="autocomplete-wrap">Najemca (z bazy najemców)
          <input name="contractTenantSearch" id="contractTenantSearch" autocomplete="off" required />
        </label>
        <p id="contractTenantSummary" class="muted" hidden></p>
        <label>Strona umowy
          <select name="contractPartyType" id="contractPartyType">
            <option value="firma">Firma</option>
            <option value="konsument">Konsument</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Pojazd</legend>
        <label class="autocomplete-wrap">Nr rejestracyjny
          <input name="contractVehiclePlate" id="contractVehiclePlateInput" autocomplete="off" required />
        </label>
        <p id="contractVehicleSummary" class="muted" hidden></p>
      </fieldset>

      <fieldset>
        <legend>Umowa</legend>
        <label>Rodzaj umowy
          <select name="contractType" id="contractTypeSelect">
            <option value="umowa">Umowa</option>
            <option value="ramowa">Umowa ramowa</option>
            <option value="jednostkowa">Umowa najmu jednostkowego</option>
          </select>
        </label>
        <label id="contractSignatureFormWrap" hidden>Forma podpisu
          <select name="contractSignatureForm" id="contractSignatureFormSelect">
            <option value="elektroniczna">Elektroniczna</option>
            <option value="papierowa">Papierowa</option>
          </select>
        </label>
        <label>Data zawarcia umowy
          <input name="contractDate" type="date" required />
        </label>
        <div class="row">
          <label>Okres obowiązywania od
            <input name="periodFrom" type="date" required />
          </label>
          <label>Okres obowiązywania do
            <input name="periodTo" type="date" required />
          </label>
        </div>
        <div class="row">
          <label>Czynsz najmu (PLN)
            <input name="rentAmount" type="number" min="0" step="0.01" inputmode="decimal" required />
          </label>
          <label>Kaucja (PLN)
            <input name="depositAmount" type="number" min="0" step="0.01" inputmode="decimal" required />
          </label>
        </div>
      </fieldset>

      <fieldset id="contractJednostkowaFieldset" hidden>
        <legend>Umowa najmu jednostkowego — dane dodatkowe</legend>
        <label>Data zawarcia umowy ramowej
          <input name="ramowaDate" type="date" />
        </label>
        <div class="row">
          <label>Data zgłoszenia
            <input name="applicationDate" type="date" />
          </label>
          <label>Data potwierdzenia
            <input name="confirmationDate" type="date" />
          </label>
        </div>
        <div class="row">
          <label>Miejsce wydania
            <input name="handoverPlace" />
          </label>
          <label>Miejsce zwrotu
            <input name="returnPlace" />
          </label>
        </div>
        <div class="row">
          <label>Podatek VAT (PLN)
            <input name="vatAmount" type="number" min="0" step="0.01" inputmode="decimal" />
          </label>
          <label>Czynsz najmu brutto (PLN)
            <input name="grossRentAmount" type="number" min="0" step="0.01" inputmode="decimal" />
          </label>
        </div>
      </fieldset>

      <p id="contractFormError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="contractSubmitBtn">
        Generuj umowę (.docx)
      </button>
    </form>
  </section>
</template>

<template id="tpl-handover">
  <section class="view">
    <form id="handoverForm" class="form">
      <fieldset>
        <legend>Pojazd</legend>
        <label class="autocomplete-wrap">Nr rejestracyjny
          <input name="vehiclePlate" id="vehiclePlateInput" autocomplete="off" required />
        </label>
        <label>Model pojazdu
          <input name="vehicleModel" required />
        </label>
        <label>VIN
          <input name="vehicleVin" />
        </label>
        <div class="row">
          <label>Przebieg (km)
            <input name="mileage" inputmode="numeric" required />
          </label>
          <label>Paliwo (%)
            <input name="fuel" inputmode="numeric" required />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Najemca</legend>
        <label>Typ najemcy
          <select name="tenantType" id="tenantTypeSelect">
            <option value="osoba">Osoba prywatna</option>
            <option value="firma">Firma</option>
          </select>
        </label>
        <label id="tenantPeselWrap" class="autocomplete-wrap">PESEL
          <input name="tenantPesel" id="tenantPeselInput" autocomplete="off" />
        </label>
        <label id="tenantNipWrap" class="autocomplete-wrap" hidden>NIP
          <input name="tenantNip" id="tenantNipInput" autocomplete="off" />
        </label>
        <label id="tenantNameLabel">Imię i nazwisko
          <input name="tenantName" required />
        </label>
        <label>Telefon
          <input name="tenantPhone" type="tel" required />
        </label>
        <label>E-mail
          <input name="tenantEmail" type="email" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Kierowca</legend>
        <label>Imię i nazwisko kierowcy
          <input name="driverName" required />
        </label>
        <label>Nr Prawa Jazdy (5.)
          <input name="driverLicense" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Adres najemcy</legend>
        <div class="row">
          <label>Ulica
            <input name="tenantStreet" required />
          </label>
          <label>Nr domu
            <input name="tenantHouseNumber" required />
          </label>
        </div>
        <div class="row">
          <label>Nr mieszkania
            <input name="tenantApartmentNumber" />
          </label>
          <label>Kod pocztowy
            <input name="tenantPostalCode" required />
          </label>
        </div>
        <label>Miejscowość
          <input name="tenantCity" required />
        </label>
      </fieldset>

      <fieldset>
        <legend>Stan pojazdu</legend>
        <label>Karoseria
          <select name="bodyCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń pasażerska
          <select name="passengerAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń ładunkowa
          <select name="cargoAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Schemat uszkodzeń</legend>
        <div class="damage-map-wrap">
          <canvas id="damageMap" class="damage-map" width="600" height="400"></canvas>
          <div class="damage-map-overlay" id="damageMapOverlay">Dotknij, aby zaznaczyć uszkodzenie</div>
        </div>
        <div class="damage-map-pending-actions" id="damageMapPendingActions" hidden>
          <button type="button" class="btn btn-secondary" id="damageMapDiscardBtn">Odrzuć</button>
          <button type="button" class="btn btn-primary" id="damageMapConfirmBtn">Zatwierdź zaznaczenie</button>
        </div>
        <button type="button" class="btn btn-text" data-action="clear-damage-map">Wyczyść wszystkie zaznaczenia</button>
      </fieldset>

      <fieldset>
        <legend>Przekazane wyposażenie</legend>
        <label class="checkbox-label">
          <input type="checkbox" name="equipmentShelf" /> Półka double-deck
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="equipmentCargoBar" /> Poprzeczka do blokowania ładunku
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="equipmentStraps" /> Zapinki (6 szt.)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="equipmentPowerCable" /> Kabel do zasilania chłodni na postoju
        </label>
      </fieldset>

      <fieldset>
        <legend>Uwagi</legend>
        <textarea name="notes" rows="3"></textarea>
      </fieldset>

      <fieldset>
        <legend>Zdjęcia</legend>
        <div id="photoStrip" class="photo-strip"></div>
        <label class="btn btn-secondary btn-block file-btn">
          + Dodaj zdjęcie
          <input type="file" accept="image/*" capture="environment" id="photoInput" hidden />
        </label>
      </fieldset>

      <fieldset>
        <legend>Podpis najemcy</legend>
        <div class="sig-placeholder" id="sigPlaceholder">Dotknij, aby podpisać</div>
        <img class="sig-preview" id="sigPreview" alt="Podpis najemcy" hidden />
        <button type="button" class="btn btn-text" id="sigEditBtn" hidden>Podpisz ponownie</button>
      </fieldset>

      <p id="formError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        Zapisz protokół wydania i wyślij e-mail
      </button>
    </form>
  </section>
</template>

<template id="tpl-return">
  <section class="view">
    <div id="returnHeader" class="return-header muted">Wczytywanie…</div>
    <form id="returnForm" class="form" hidden>
      <fieldset>
        <legend>Stan przy zwrocie</legend>
        <div class="row">
          <label>Przebieg (km)
            <input name="mileage" inputmode="numeric" required />
          </label>
          <label>Paliwo (%)
            <input name="fuel" inputmode="numeric" required />
          </label>
        </div>
        <label>Uwagi
          <textarea name="notes" rows="3"></textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Stan pojazdu</legend>
        <label>Karoseria
          <select name="bodyCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń pasażerska
          <select name="passengerAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń ładunkowa
          <select name="cargoAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Schemat uszkodzeń</legend>
        <div class="damage-map-wrap">
          <canvas id="damageMap" class="damage-map" width="600" height="400"></canvas>
          <div class="damage-map-overlay" id="damageMapOverlay">Dotknij, aby zaznaczyć uszkodzenie</div>
        </div>
        <div class="damage-map-pending-actions" id="damageMapPendingActions" hidden>
          <button type="button" class="btn btn-secondary" id="damageMapDiscardBtn">Odrzuć</button>
          <button type="button" class="btn btn-primary" id="damageMapConfirmBtn">Zatwierdź zaznaczenie</button>
        </div>
        <button type="button" class="btn btn-text" data-action="clear-damage-map">Wyczyść wszystkie zaznaczenia</button>
        <p class="damage-map-legend">
          <span class="damage-map-legend-item"><span class="damage-map-legend-dot damage-map-legend-dot--existing"></span>Uszkodzenie zgłoszone przy wydaniu</span>
          <span class="damage-map-legend-item"><span class="damage-map-legend-dot damage-map-legend-dot--new"></span>Nowe uszkodzenie stwierdzone przy zwrocie</span>
        </p>
      </fieldset>

      <fieldset id="returnEquipmentFieldset" hidden>
        <legend>Zwracane wyposażenie</legend>
        <div id="returnEquipmentContainer"></div>
      </fieldset>

      <fieldset>
        <legend>Zdjęcia</legend>
        <div id="photoStrip" class="photo-strip"></div>
        <label class="btn btn-secondary btn-block file-btn">
          + Dodaj zdjęcie
          <input type="file" accept="image/*" capture="environment" id="photoInput" hidden />
        </label>
      </fieldset>

      <fieldset>
        <legend>Podpis najemcy</legend>
        <div class="sig-placeholder" id="sigPlaceholder">Dotknij, aby podpisać</div>
        <img class="sig-preview" id="sigPreview" alt="Podpis najemcy" hidden />
        <button type="button" class="btn btn-text" id="sigEditBtn" hidden>Podpisz ponownie</button>
      </fieldset>

      <p id="formError" class="error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        Zapisz protokół zwrotu i wyślij e-mail
      </button>
    </form>
  </section>
</template>

<template id="tpl-regenerate">
  <section class="view">
    <p class="muted">Dane odzyskane z przerwanego zapisu (protokół nie zdążył się wygenerować/wysłać). Zdjęcia, podpis i schemat uszkodzeń są już bezpiecznie zapisane i nie trzeba ich powtarzać — sprawdź i popraw dane poniżej, zanim protokół zostanie złożony.</p>
    <div id="regenerateHeader" class="return-header muted">Wczytywanie…</div>
    <p id="regenerateFormError" class="error" hidden></p>
    <form id="regenerateForm" class="form" hidden>
      <fieldset id="regenerateVehicleFieldset">
        <legend>Pojazd</legend>
        <label>Nr rejestracyjny
          <input name="vehiclePlate" required />
        </label>
        <label>Model pojazdu
          <input name="vehicleModel" required />
        </label>
        <label>VIN
          <input name="vehicleVin" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Stan przy tej fazie wynajmu</legend>
        <div class="row">
          <label>Przebieg (km)
            <input name="mileage" inputmode="numeric" required />
          </label>
          <label>Paliwo (%)
            <input name="fuel" inputmode="numeric" required />
          </label>
        </div>
      </fieldset>

      <fieldset id="regenerateTenantFieldset">
        <legend>Najemca</legend>
        <label>Typ najemcy
          <select name="tenantType" id="regenerateTenantTypeSelect">
            <option value="osoba">Osoba prywatna</option>
            <option value="firma">Firma</option>
          </select>
        </label>
        <label id="regenerateTenantPeselWrap">PESEL
          <input name="tenantPesel" />
        </label>
        <label id="regenerateTenantNipWrap" hidden>NIP
          <input name="tenantNip" />
        </label>
        <label>Imię i nazwisko / nazwa firmy
          <input name="tenantName" required />
        </label>
        <label>Telefon
          <input name="tenantPhone" type="tel" required />
        </label>
        <label>E-mail
          <input name="tenantEmail" type="email" required />
        </label>
      </fieldset>

      <fieldset id="regenerateDriverFieldset">
        <legend>Kierowca</legend>
        <label>Imię i nazwisko kierowcy
          <input name="driverName" required />
        </label>
        <label>Nr Prawa Jazdy (5.)
          <input name="driverLicense" required />
        </label>
      </fieldset>

      <fieldset id="regenerateAddressFieldset">
        <legend>Adres najemcy</legend>
        <div class="row">
          <label>Ulica
            <input name="tenantStreet" />
          </label>
          <label>Nr domu
            <input name="tenantHouseNumber" />
          </label>
        </div>
        <div class="row">
          <label>Nr mieszkania
            <input name="tenantApartmentNumber" />
          </label>
          <label>Kod pocztowy
            <input name="tenantPostalCode" />
          </label>
        </div>
        <label>Miejscowość
          <input name="tenantCity" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Stan pojazdu</legend>
        <label>Karoseria
          <select name="bodyCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń pasażerska
          <select name="passengerAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
        <label>Przestrzeń ładunkowa
          <select name="cargoAreaCondition">
            <option value="czysta">Czysta</option>
            <option value="brudna">Brudna</option>
          </select>
        </label>
      </fieldset>

      <fieldset>
        <legend>Wyposażenie</legend>
        <div id="regenerateEquipmentContainer"></div>
      </fieldset>

      <fieldset>
        <legend>Uwagi</legend>
        <textarea name="notes" rows="3"></textarea>
      </fieldset>

      <fieldset>
        <legend>Zdjęcia (odzyskane z zapisu)</legend>
        <div id="regeneratePhotoStrip" class="photo-strip"></div>
        <p class="muted" id="regeneratePhotoEmpty" hidden>Brak zapisanych zdjęć.</p>
      </fieldset>

      <fieldset>
        <legend>Schemat uszkodzeń (odzyskany z zapisu)</legend>
        <img id="regenerateDamageMapPreview" style="width:100%;height:auto;border-radius:8px;border:1px solid var(--line);" alt="Schemat uszkodzeń" />
        <p class="muted" id="regenerateDamageMapEmpty" hidden>Brak zapisanego schematu uszkodzeń.</p>
      </fieldset>

      <fieldset>
        <legend>Zdjęcia uszkodzeń z bazy pojazdu (dołączane automatycznie)</legend>
        <p class="muted">Aktualna dokumentacja uszkodzeń zapisana przy tym pojeździe — dołączy się do protokołu tak samo, jak przy zwykłym wydaniu/zwrocie.</p>
        <div id="regenerateVehicleDamagePhotoStrip" class="photo-strip"></div>
        <p class="muted" id="regenerateVehicleDamagePhotoEmpty" hidden>Brak zdjęć uszkodzeń w bazie pojazdu.</p>
      </fieldset>

      <fieldset>
        <legend>Podpis (odzyskany z zapisu)</legend>
        <img id="regenerateSigPreview" class="sig-preview" alt="Podpis" />
      </fieldset>

      <p id="regenerateSuccess" class="muted" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="regenerateSubmitBtn">
        Zatwierdź dane i wygeneruj protokół
      </button>
    </form>
  </section>
</template>

<div id="signatureModal" class="signature-modal" hidden>
  <div class="signature-modal-inner">
    <div class="signature-rotate-hint" id="modalSigRotateHint">Obróć telefon poziomo, aby podpisać</div>
    <div class="signature-modal-canvas-wrap" id="modalSigCanvasWrap" hidden>
      <canvas id="modalSigCanvas" class="signature-modal-canvas"></canvas>
      <div class="signature-modal-actions">
        <button type="button" class="btn btn-secondary" id="modalSigClear">Wyczyść</button>
        <button type="button" class="btn btn-secondary" id="modalSigCancel">Anuluj</button>
        <button type="button" class="btn btn-primary" id="modalSigConfirm">Zatwierdź podpis</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="/panel-najmu/js/vendor/pizzip.min.js"></script>
<script src="/panel-najmu/js/vendor/docxtemplater.browser.min.js"></script>
<script type="module" src="/panel-najmu/js/app.js"></script>
</body>
</html>
